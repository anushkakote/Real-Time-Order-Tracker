<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Order Tracker | Live Dashboard</title>
    <meta name="description"
        content="Real-time order tracking dashboard with live WebSocket updates powered by Kafka and PostgreSQL CDC." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
    <!-- ── Toast Container ── -->
    <div id="toast-container"></div>

    <!-- ── Header ── -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                    </svg>
                </div>
                <div>
                    <h1>OrderPulse</h1>
                    <p class="subtitle">Real-Time Order Tracker</p>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div class="client-count" id="client-count">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <span id="client-count-text">0 viewers</span>
            </div>
            <div class="connection-status" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- ── Stats Cards ── -->
        <section class="stats-grid" id="stats-section">
            <div class="stat-card stat-total" id="stat-total">
                <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
                        <line x1="8" y1="21" x2="16" y2="21" />
                        <line x1="12" y1="17" x2="12" y2="21" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="total-count">0</span>
                    <span class="stat-label">Total Orders</span>
                </div>
            </div>
            <div class="stat-card stat-pending" id="stat-pending">
                <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="pending-count">0</span>
                    <span class="stat-label">Pending</span>
                </div>
            </div>
            <div class="stat-card stat-shipped" id="stat-shipped">
                <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="1" y="3" width="15" height="13" />
                        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
                        <circle cx="5.5" cy="18.5" r="2.5" />
                        <circle cx="18.5" cy="18.5" r="2.5" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="shipped-count">0</span>
                    <span class="stat-label">Shipped</span>
                </div>
            </div>
            <div class="stat-card stat-delivered" id="stat-delivered">
                <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                        <polyline points="22 4 12 14.01 9 11.01" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="delivered-count">0</span>
                    <span class="stat-label">Delivered</span>
                </div>
            </div>
        </section>

        <!-- ── Main Grid: Table + Form ── -->
        <section class="content-grid">
            <!-- Orders Table -->
            <div class="card orders-card">
                <div class="card-header">
                    <h2>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <line x1="16" y1="13" x2="8" y2="13" />
                            <line x1="16" y1="17" x2="8" y2="17" />
                            <polyline points="10 9 9 9 8 9" />
                        </svg>
                        Orders
                    </h2>
                    <button class="btn btn-refresh" id="btn-refresh" title="Refresh orders">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="23 4 23 10 17 10" />
                            <polyline points="1 20 1 14 7 14" />
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                        </svg>
                    </button>
                </div>
                <div class="table-wrapper" id="table-wrapper">
                    <table id="orders-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Product</th>
                                <th>Status</th>
                                <th>Updated</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <tr class="empty-row">
                                <td colspan="6">
                                    <div class="empty-state">
                                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="1">
                                            <path
                                                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                                        </svg>
                                        <p>Loading orders...</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right Sidebar -->
            <div class="sidebar">
                <!-- Create/Edit Order Form -->
                <div class="card form-card">
                    <div class="card-header">
                        <h2 id="form-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <line x1="5" y1="12" x2="19" y2="12" />
                            </svg>
                            New Order
                        </h2>
                    </div>
                    <form id="order-form">
                        <input type="hidden" id="form-id" />
                        <div class="form-group">
                            <label for="form-customer">Customer Name</label>
                            <input type="text" id="form-customer" placeholder="e.g. John Doe" required />
                        </div>
                        <div class="form-group">
                            <label for="form-email">Email</label>
                            <input type="email" id="form-email" placeholder="e.g. john@example.com" />
                        </div>
                        <div class="form-group">
                            <label for="form-phone">Phone</label>
                            <input type="tel" id="form-phone" placeholder="e.g. +1234567890" />
                        </div>
                        <div class="form-group">
                            <label for="form-product">Product Name</label>
                            <input type="text" id="form-product" placeholder="e.g. MacBook Pro" required />
                        </div>
                        <div class="form-group">
                            <label for="form-status">Status</label>
                            <select id="form-status">
                                <option value="pending">⏳ Pending</option>
                                <option value="shipped">🚚 Shipped</option>
                                <option value="delivered">✅ Delivered</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="btn-submit">Create Order</button>
                            <button type="button" class="btn btn-secondary" id="btn-cancel"
                                style="display:none;">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Activity Feed -->
                <div class="card activity-card">
                    <div class="card-header">
                        <h2>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                            </svg>
                            Live Activity
                        </h2>
                        <span class="live-badge">
                            <span class="live-dot"></span>
                            LIVE
                        </span>
                    </div>
                    <div class="activity-feed" id="activity-feed">
                        <div class="activity-empty">
                            <p>Waiting for real-time events...</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>


    </main>

    <!-- ── Edit Modal ── -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Order</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="edit-form">
                <input type="hidden" id="edit-id" />
                <div class="form-group">
                    <label for="edit-customer">Customer Name</label>
                    <input type="text" id="edit-customer" required />
                </div>
                <div class="form-group">
                    <label for="edit-email">Email</label>
                    <input type="email" id="edit-email" />
                </div>
                <div class="form-group">
                    <label for="edit-phone">Phone</label>
                    <input type="tel" id="edit-phone" />
                </div>
                <div class="form-group">
                    <label for="edit-product">Product Name</label>
                    <input type="text" id="edit-product" required />
                </div>
                <div class="form-group">
                    <label for="edit-status">Status</label>
                    <select id="edit-status">
                        <option value="pending">⏳ Pending</option>
                        <option value="shipped">🚚 Shipped</option>
                        <option value="delivered">✅ Delivered</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>

</html>
