version: '3.8'

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:15-alpine
    container_name: rt-postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d orders_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # ── Zookeeper (Kafka dependency) ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rt-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  # ── Apache Kafka Message Broker ──
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rt-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - app-network

  # ── Order Microservice (REST API + CDC Listener) ──
  order-service:
    build: ./services/order-service
    container_name: rt-order-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://admin:admin123@postgres:5432/orders_db
      KAFKA_BROKER: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network

  # ── Notification Microservice (Kafka Consumer + WebSocket Server) ──
  notification-service:
    build: ./services/notification-service
    container_name: rt-notification-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network

  # ── Alert Microservice (Email + SMS via Kafka) ──
  alert-service:
    build: ./services/alert-service
    container_name: rt-alert-service
    environment:
      KAFKA_BROKER: kafka:9092
      # ── Email (Gmail SMTP) — fill in to enable ──
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      # ── SMS (Twilio) — set your credentials here ──
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_PHONE_NUMBER: ""
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network

  # ── Frontend (Nginx + Static Files) ──
  frontend:
    build: ./services/frontend
    container_name: rt-frontend
    ports:
      - "8090:80"
    depends_on:
      - order-service
      - notification-service
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
